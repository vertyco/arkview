# ArkViewer v3 - reference compose file.
#
# Copy this to docker-compose.yml (gitignored) and edit for your host:
#   cp docker-compose.example.yml docker-compose.yml
#
# One container per map. Each service needs:
#   - a unique host port mapped to container 8000
#   - a per-map config.ini bound at /app/config.ini (read-only)
#   - a per-map state dir bound at /var/lib/arkviewer (read-write, SQLite DB)
#   - your ARK save tree mounted read-only
#   - (optional) a shared cluster directory mounted read-only
#
# Inside each config.ini, set MapFilePath to the path AS SEEN INSIDE THE
# CONTAINER. ASA layout is `/saves/<MapName>_WP.ark` when binding the
# `Saved/SavedArks/<MapName>_WP/` directory to /saves; ASE is
# `/saves/<MapName>.ark` when binding `Saved/SavedArks/`. Keep Port=8000
# inside the config; the host port comes from the `ports:` mapping below.

x-arkviewer-common: &arkviewer-common
  image: arkviewer:latest
  build: .
  restart: unless-stopped
  mem_limit: 4g
  mem_reservation: 2g
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # ---------------------------------------------------------------------
  # Example: TheIsland on host port 8101
  # ---------------------------------------------------------------------
  arkviewer-theisland:
    <<: *arkviewer-common
    container_name: arkviewer-theisland
    ports:
      - "8101:8000"
    volumes:
      - ./configs/theisland.ini:/app/config.ini:ro
      - ./state/theisland:/var/lib/arkviewer
      # Replace with your actual per-map save directory:
      - /path/to/ark/theisland/Saved/SavedArks/TheIsland_WP:/saves:ro
      # Optional shared cluster dir; remove if not running a cluster:
      - /path/to/ark/cluster:/cluster:ro

  # ---------------------------------------------------------------------
  # Example: Ragnarok on host port 8102
  # ---------------------------------------------------------------------
  arkviewer-ragnarok:
    <<: *arkviewer-common
    container_name: arkviewer-ragnarok
    ports:
      - "8102:8000"
    volumes:
      - ./configs/ragnarok.ini:/app/config.ini:ro
      - ./state/ragnarok:/var/lib/arkviewer
      - /path/to/ark/ragnarok/Saved/SavedArks/Ragnarok_WP:/saves:ro
      - /path/to/ark/cluster:/cluster:ro

  # ---------------------------------------------------------------------
  # To add another map: copy a service block above, then change
  #   - container_name
  #   - host port in `ports:`
  #   - configs/<map>.ini path
  #   - state/<map> path
  #   - save bind path (point at the `<Map>_WP/` dir for ASA)
  # Create the matching configs/<map>.ini and state/<map>/ on disk first.
  # ---------------------------------------------------------------------
